<!DOCTYPE html>
<html>
<head>
  <title>My E-commerce Store</title>
  <style>
    body { font-family: Arial; background: #f5f5f5; margin:0; padding:20px; }
    h1 { text-align:center; }
    #cart { text-align:right; font-weight:bold; font-size:18px; }
    .products { display:grid; grid-template-columns: repeat(3, 1fr); gap:20px; margin-top:20px; }
    .card { background:white; padding:15px; border-radius:12px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    .card img { width:100%; height:200px; object-fit:cover; border-radius:8px; }
    button { background:black; color:white; padding:10px 15px; border:none; border-radius:5px; cursor:pointer; margin-top:10px; width:100%; }
  </style>
</head>
<body>
  <h1>My E-commerce Store</h1>
  <div id="cart">Cart: 0 items</div>
  <div class="products" id="products"></div>
  <script>
    let cartCount = 0;
    fetch('/api/products').then(r=>r.json()).then(products=>{
      const c = document.getElementById('products');
      products.forEach(p=>{
        c.innerHTML += `<div class="card">
          <img src="${p.image}" alt="${p.name}">
          <h3>${p.name}</h3><p>Rs. ${p.price}</p>
          <button onclick="addToCart()">Add to Cart</button>
        </div>`;
      });
    });
    function addToCart(){ cartCount++; document.getElementById('cart').innerText=`Cart: ${cartCount} items`; }
  </script>
</body>
</html>
